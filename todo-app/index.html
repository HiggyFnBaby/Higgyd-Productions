<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo</title>
<style>
  :root {
    --grad-1: #a7c7ff;
    --grad-2: #c9a7f7;
    --grad-3: #ffb4c6;
    --card-bg: rgba(255, 255, 255, 0.62);
    --card-border: rgba(255, 255, 255, 0.75);
    --card-shadow: rgba(31, 38, 82, 0.18);
    --text: #1c1c1e;
    --text-muted: #6e6e73;
    --separator: rgba(60, 60, 67, 0.14);
    --row-hover: rgba(120, 120, 128, 0.08);
    --accent: #0a84ff;
    --accent-ink: #ffffff;
    --danger: #ff3b30;
    --field-bg: rgba(118, 118, 128, 0.12);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --grad-1: #1b2038;
      --grad-2: #3a2350;
      --grad-3: #47203a;
      --card-bg: rgba(40, 40, 48, 0.55);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: rgba(0, 0, 0, 0.45);
      --text: #f2f2f7;
      --text-muted: #98989f;
      --separator: rgba(255, 255, 255, 0.1);
      --row-hover: rgba(255, 255, 255, 0.06);
      --accent: #0a84ff;
      --accent-ink: #ffffff;
      --danger: #ff453a;
      --field-bg: rgba(118, 118, 128, 0.24);
    }
  }

  :root[data-theme="dark"] {
    --grad-1: #1b2038;
    --grad-2: #3a2350;
    --grad-3: #47203a;
    --card-bg: rgba(40, 40, 48, 0.55);
    --card-border: rgba(255, 255, 255, 0.12);
    --card-shadow: rgba(0, 0, 0, 0.45);
    --text: #f2f2f7;
    --text-muted: #98989f;
    --separator: rgba(255, 255, 255, 0.1);
    --row-hover: rgba(255, 255, 255, 0.06);
    --accent: #0a84ff;
    --accent-ink: #ffffff;
    --danger: #ff453a;
    --field-bg: rgba(118, 118, 128, 0.24);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 9vh 20px 60px;
    background:
      radial-gradient(circle at 18% 12%, var(--grad-3), transparent 55%),
      radial-gradient(circle at 82% 8%, var(--grad-2), transparent 50%),
      radial-gradient(circle at 50% 100%, var(--grad-1), transparent 60%),
      linear-gradient(160deg, var(--grad-1), var(--grad-2) 55%, var(--grad-3));
    background-attachment: fixed;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 4px 18px;
  }

  .app-icon {
    flex-shrink: 0;
    width: 40px;
    height: 40px;
    border-radius: 11px;
    background: linear-gradient(160deg, #ff9f43, #ff5e57);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 14px rgba(255, 94, 87, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  .app-icon svg {
    width: 20px;
    height: 20px;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0;
    color: #fff;
    text-shadow: 0 1px 12px rgba(0, 0, 0, 0.18);
  }

  .subtitle {
    margin: 1px 0 0;
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.15);
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 6px 18px 10px;
    backdrop-filter: blur(28px) saturate(1.4);
    -webkit-backdrop-filter: blur(28px) saturate(1.4);
    box-shadow: 0 20px 45px var(--card-shadow), inset 0 1px 0 rgba(255, 255, 255, 0.3);
  }

  form {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--separator);
  }

  form input {
    flex: 1;
    min-width: 0;
    border: none;
    background: var(--field-bg);
    outline: none;
    font-size: 16px;
    color: var(--text);
    padding: 9px 13px;
    border-radius: 11px;
    font-family: inherit;
    transition: box-shadow 0.15s ease;
  }

  form input::placeholder {
    color: var(--text-muted);
  }

  form input:focus {
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  form button {
    flex-shrink: 0;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 10px color-mix(in srgb, var(--accent) 55%, transparent);
    transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), filter 0.15s ease;
  }

  form button:hover {
    filter: brightness(1.08);
  }

  form button:active {
    transform: scale(0.9);
  }

  ul {
    list-style: none;
    margin: 0;
    padding: 4px 0 6px;
  }

  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 2px;
    border-bottom: 1px solid var(--separator);
    border-radius: 10px;
    transition: background 0.15s ease;
  }

  li:last-child {
    border-bottom: none;
  }

  li:hover {
    background: var(--row-hover);
  }

  .check {
    flex-shrink: 0;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--text-muted) 60%, transparent);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.18s ease, background 0.18s ease, transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .check:active {
    transform: scale(0.88);
  }

  .check svg {
    width: 13px;
    height: 13px;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.15s ease, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  li.done .check {
    background: var(--accent);
    border-color: var(--accent);
  }

  li.done .check svg {
    opacity: 1;
    transform: scale(1);
    color: var(--accent-ink);
  }

  .label {
    flex: 1;
    font-size: 16px;
    line-height: 1.35;
    cursor: pointer;
    word-break: break-word;
    transition: color 0.18s ease;
  }

  li.done .label {
    text-decoration: line-through;
    color: var(--text-muted);
  }

  .remove {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: var(--danger);
    color: #fff;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.15s ease, transform 0.15s ease, filter 0.15s ease;
  }

  li:hover .remove {
    opacity: 1;
    transform: scale(1);
  }

  .remove:hover {
    filter: brightness(1.1);
  }

  .empty {
    color: var(--text-muted);
    font-size: 14px;
    padding: 22px 2px;
    text-align: center;
  }

  .count {
    margin: 14px 2px 2px;
    font-size: 12px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: rgba(255, 255, 255, 0.85);
    text-shadow: 0 1px 8px rgba(0, 0, 0, 0.15);
    text-align: center;
  }

  .check:focus-visible,
  .remove:focus-visible,
  form input:focus-visible,
  form button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<main>
  <div class="titlebar">
    <div class="app-icon">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div>
      <h1>Todo</h1>
      <p class="subtitle" id="subtitle"></p>
    </div>
  </div>

  <div class="card">
    <form id="form">
      <input id="input" type="text" placeholder="Add a task…" autocomplete="off" autofocus />
      <button type="submit" aria-label="Add">+</button>
    </form>

    <ul id="list"></ul>
    <p id="empty" class="empty" hidden>Nothing here yet ✨</p>
  </div>

  <p id="count" class="count"></p>
</main>

<script>
  const STORAGE_KEY = "minimal-todo-items";

  function load() {
    try {
      return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      return [];
    }
  }

  function save(items) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
  }

  let items = load();

  const list = document.getElementById("list");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const empty = document.getElementById("empty");
  const count = document.getElementById("count");
  const subtitle = document.getElementById("subtitle");

  function sorted() {
    return [...items].sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return a.order - b.order;
    });
  }

  function render() {
    list.innerHTML = "";
    const rows = sorted();

    empty.hidden = rows.length > 0;

    rows.forEach((item) => {
      const li = document.createElement("li");
      li.className = item.done ? "done" : "";
      li.dataset.id = item.id;

      const check = document.createElement("div");
      check.className = "check";
      check.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><path d="M2 8L6 12L14 3" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      check.setAttribute("role", "checkbox");
      check.setAttribute("aria-checked", String(item.done));
      check.tabIndex = 0;
      check.addEventListener("click", () => toggle(item.id));
      check.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          toggle(item.id);
        }
      });

      const label = document.createElement("span");
      label.className = "label";
      label.textContent = item.text;
      label.addEventListener("click", () => toggle(item.id));

      const remove = document.createElement("button");
      remove.className = "remove";
      remove.type = "button";
      remove.textContent = "✕";
      remove.setAttribute("aria-label", "Delete");
      remove.addEventListener("click", () => removeItem(item.id));

      li.append(check, label, remove);
      list.appendChild(li);
    });

    const remaining = items.filter((i) => !i.done).length;
    count.textContent = items.length
      ? `${remaining} left · ${items.length} total`
      : "";
    subtitle.textContent = items.length
      ? `${remaining} remaining`
      : "All clear";
  }

  function toggle(id) {
    const item = items.find((i) => i.id === id);
    if (!item) return;
    item.done = !item.done;
    save(items);
    render();
  }

  function removeItem(id) {
    items = items.filter((i) => i.id !== id);
    save(items);
    render();
  }

  let nextOrder = items.reduce((max, i) => Math.max(max, i.order || 0), 0) + 1;

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    items.push({
      id: crypto.randomUUID(),
      text,
      done: false,
      order: nextOrder++,
    });
    save(items);
    input.value = "";
    render();
  });

  render();
</script>
</body>
</html>
